<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="favicon.ico">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>POSMaker — Login</title>
<script>
(function(){ try { var t = localStorage.getItem('pm_theme') || 'light'; document.documentElement.setAttribute('data-theme', t); } catch(_) { document.documentElement.setAttribute('data-theme','light'); } })();
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="js/supabase.js"></script>
<script src="js/config.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#09090f;--s1:#111120;--border:#252540;--accent:#00b4d8;--text:#f0f0f8;--muted:#8888aa;--dim:#44445a;--danger:#ef4444;--success:#22c55e}
@media(prefers-color-scheme:light){:root{--bg:#f4f7fc;--s1:#fff;--border:#d2daea;--text:#0d1a2e;--muted:#5a6e88;--dim:#a0b0c4;--danger:#c0392b;--success:#0a7a42}}
:root[data-theme="dark"]{--bg:#09090f;--s1:#111120;--border:#252540;--text:#f0f0f8;--muted:#8888aa;--dim:#44445a;--danger:#ef4444;--success:#22c55e}
:root[data-theme="light"]{--bg:#f4f7fc;--s1:#fff;--border:#d2daea;--text:#0d1a2e;--muted:#5a6e88;--dim:#a0b0c4;--danger:#c0392b;--success:#0a7a42}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px}
.wrap{width:min(420px,100%)}
.logo{text-align:center;font-size:22px;font-weight:800;margin-bottom:32px}
.logo span{color:var(--accent)}
.card{background:var(--s1);border:1px solid var(--border);border-radius:16px;padding:36px}
h1{font-size:22px;font-weight:800;margin-bottom:4px}
.sub{font-size:14px;color:var(--muted);margin-bottom:28px}
.field{margin-bottom:16px}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
input{width:100%;padding:11px 14px;background:var(--bg);border:1.5px solid var(--border);border-radius:8px;color:var(--text);font-size:15px;font-family:'Inter',sans-serif;outline:none;transition:border-color .15s}
input:focus{border-color:var(--accent)}
input::placeholder{color:var(--dim)}
.btn{width:100%;padding:13px;background:var(--accent);border:none;color:#fff;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;margin-top:6px;font-family:'Inter',sans-serif;transition:opacity .15s}
.btn:hover{opacity:.88}
.btn:disabled{opacity:.4;cursor:not-allowed}
.err{color:var(--danger);font-size:13px;min-height:18px;margin-bottom:10px;text-align:center}
.signup-link{text-align:center;font-size:13px;color:var(--muted);margin-top:18px}
.signup-link a{color:var(--accent);font-weight:600}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<a href="index.html" style="position:fixed;top:16px;left:16px;color:var(--muted);font-size:13px;font-weight:600;text-decoration:none;display:flex;align-items:center;gap:6px;z-index:99">&#8592; Back to Home</a>
<button id="themeToggle" onclick="toggleTheme()" title="Switch theme" aria-label="Switch theme" style="position:fixed;top:16px;right:16px;background:transparent;border:1px solid var(--border);color:var(--text);border-radius:8px;width:32px;height:32px;font-size:14px;cursor:pointer;z-index:99">&#127769;</button>
<div class="wrap">
  <div class="logo">POS<span>Maker</span></div>
  <div class="card">
    <div id="loginPanel">
      <h1>Admin login</h1>
      <p class="sub">Sign in to manage your store.</p>
      <div class="field">
        <label>Email</label>
        <input id="email" type="email" placeholder="owner@example.com" autocomplete="email">
      </div>
      <div class="field">
        <label>Password</label>
        <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
      </div>
      <div style="text-align:right;margin:-10px 0 14px">
        <a href="#" onclick="showForgot();return false" style="font-size:12px;color:var(--accent);font-weight:600;text-decoration:none">Forgot password?</a>
      </div>
      <div class="err" id="err"></div>
      <button class="btn" id="btn" onclick="doLogin()">Log In →</button>
      <div class="signup-link">Don't have a store? <a href="signup.html">Create one free</a></div>
    </div>
    <div id="forgotPanel" style="display:none">
      <h1>Reset password</h1>
      <p class="sub">Enter your email and we'll send you a link to reset it.</p>
      <div class="field">
        <label>Email</label>
        <input id="forgotEmail" type="email" placeholder="owner@example.com" autocomplete="email">
      </div>
      <div class="err" id="forgotErr"></div>
      <div id="forgotMsg" style="display:none;color:var(--success);font-size:13px;margin-bottom:10px;text-align:center">Check your email for the reset link.</div>
      <button class="btn" id="forgotBtn" onclick="sendResetLink()">Send Reset Link</button>
      <div class="signup-link"><a href="#" onclick="showLogin();return false">&#8592; Back to login</a></div>
    </div>
  </div>
</div>

<script>
if (typeof supabase === 'undefined') {
  document.getElementById('err').textContent = 'Failed to load. Check your internet and reload the page.';
}
const { createClient } = (typeof supabase !== 'undefined' ? supabase : {});
const _sb = typeof createClient === 'function' ? createClient(SUPABASE_URL, SUPABASE_ANON) : null;

// Redirect manager/staff links to staff-login page
const _urlSid = new URLSearchParams(location.search).get('sid') || '';
if (_urlSid) { location.href = 'staff-login.html?sid=' + _urlSid; }

async function doLogin() {
  const email = document.getElementById('email').value.trim();
  const pw    = document.getElementById('pw').value;
  const errEl = document.getElementById('err');
  const btn   = document.getElementById('btn');
  if (!_sb) { errEl.textContent = 'Page failed to load. Please reload.'; return; }

  errEl.textContent = '';
  if (!email || !pw) { errEl.textContent = 'Please enter your email and password.'; return; }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Signing in…';
  errEl.textContent = '';

  const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error('Connection timed out. Check your internet and try again.')), 15000));
  try {
    const { data, error } = await Promise.race([
      _sb.auth.signInWithPassword({ email, password: pw }),
      timeout
    ]);
    if (error) { errEl.textContent = error.message; btn.disabled = false; btn.textContent = 'Log In →'; return; }

    // Owners with multiple POS terminals/branches have more than one row
    // here — .maybeSingle() throws on >1 row, which was silently sending
    // them to signup.html as if they had no store at all. Picking the
    // oldest one as the login landing store fixes that without changing
    // behavior for the common single-store case.
    const { data: stores } = await Promise.race([
      _sb.from('stores').select('id').eq('owner_id', data.user.id).order('created_at', { ascending: true }).limit(1),
      new Promise((_, rej) => setTimeout(() => rej(new Error('Connection timed out.')), 10000))
    ]);
    const store = stores?.[0];
    localStorage.setItem('pm_store_id', store?.id || '');
    location.href = store ? 'dashboard.html' : 'signup.html';
  } catch(e) {
    errEl.textContent = e.message;
    btn.disabled = false; btn.textContent = 'Log In →';
  }
}


document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

function showForgot() {
  document.getElementById('loginPanel').style.display = 'none';
  document.getElementById('forgotPanel').style.display = '';
  document.getElementById('forgotErr').textContent = '';
  document.getElementById('forgotMsg').style.display = 'none';
  document.getElementById('forgotEmail').value = document.getElementById('email').value;
}
function showLogin() {
  document.getElementById('forgotPanel').style.display = 'none';
  document.getElementById('loginPanel').style.display = '';
}
async function sendResetLink() {
  const email = document.getElementById('forgotEmail').value.trim();
  const errEl = document.getElementById('forgotErr');
  const msgEl = document.getElementById('forgotMsg');
  const btn   = document.getElementById('forgotBtn');
  errEl.textContent = ''; msgEl.style.display = 'none';
  if (!_sb) { errEl.textContent = 'Page failed to load. Please reload.'; return; }
  if (!email) { errEl.textContent = 'Please enter your email.'; return; }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Sending…';
  const redirectTo = location.origin + location.pathname.replace(/[^/]+$/, 'reset-password.html');
  const { error } = await _sb.auth.resetPasswordForEmail(email, { redirectTo });
  btn.disabled = false; btn.textContent = 'Send Reset Link';
  if (error) { errEl.textContent = error.message; return; }
  msgEl.style.display = 'block';
}

// Auto-update service worker on every open
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(reg=>{
    function _au(w){w.postMessage({type:'SKIP_WAITING'});}
    if(reg.waiting) _au(reg.waiting);
    reg.addEventListener('updatefound',()=>{const n=reg.installing;n.addEventListener('statechange',()=>{if(n.state==='installed'&&navigator.serviceWorker.controller)_au(n);});});
    reg.update().catch(()=>{});
  }).catch(()=>{});
    // Intentionally no reload-on-update: nothing about the active session
  // (staff login, device pairing) lives in the SW cache, so there's nothing
  // to gain from reloading — it only disrupted whoever was using the page.
  // The new worker still takes over future requests via skipWaiting() above;
  // this tab just keeps running until it's next closed and reopened.
}

function _currentTheme() {
  const explicit = document.documentElement.getAttribute('data-theme');
  if (explicit) return explicit;
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
}
function _updateThemeIcon() {
  const btn = document.getElementById('themeToggle');
  if (btn) btn.textContent = _currentTheme() === 'light' ? '☀️' : '🌙';
}
function toggleTheme() {
  const next = _currentTheme() === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('pm_theme', next); } catch(_) {}
  _updateThemeIcon();
}
_updateThemeIcon();
</script>
</body>
</html>
